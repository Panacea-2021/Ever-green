name: Build APK

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Bump Gradle in CI only
        run: sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-9.3.1-\1.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://evergreen-backend-lgmy.onrender.com \
            --dart-define=API_KEY=${{ secrets.API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-release-apk
          path: build/app/outputs/flutter-apk/*.apk
