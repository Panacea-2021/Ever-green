name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://evergreen-backend-lgmy.onrender.com/
          --dart-define=API_KEY=${{ secrets.API_KEY }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: Main APK (latest)
          files: build/app/outputs/flutter-apk/app-release.apk
