name: CI
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Create google-services.json
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON secret" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build debug APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Debug APK build failed after 3 attempts." >&2
              exit 1
            fi
            delay=$((30 * attempt))
            echo "Build failed; retrying in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done
