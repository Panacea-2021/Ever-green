<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EverGreen Equipment Management">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EverGreen">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png"/>
  <title>EverGreen</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F6FBF7; }
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, #EAF5EC 60%, #DCF0E1 100%);
      font-family: Montserrat, "Segoe UI", Roboto, Arial, sans-serif;
      transition: opacity 0.35s ease;
    }
    #app-loader.hide { opacity: 0; pointer-events: none; }
    #app-loader .logo {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      background: #FFFFFF;
      box-shadow: 0 14px 36px rgba(16, 98, 32, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: app-loader-pulse 1.6s ease-in-out infinite;
    }
    #app-loader .logo img { width: 60px; height: 60px; border-radius: 14px; }
    #app-loader .name {
      font-size: 22px;
      font-weight: 700;
      color: #106220;
      letter-spacing: 0.3px;
    }
    #app-loader .bar {
      width: 160px;
      height: 4px;
      border-radius: 4px;
      background: rgba(16, 98, 32, 0.12);
      overflow: hidden;
    }
    #app-loader .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #106220, #5FB36F);
      animation: app-loader-slide 1.1s ease-in-out infinite;
    }
    @keyframes app-loader-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes app-loader-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="logo"><img src="icons/icon-192.png" alt=""></div>
    <div class="name">EverGreen</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (!loader) return;
      loader.classList.add('hide');
      setTimeout(function () { loader.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
