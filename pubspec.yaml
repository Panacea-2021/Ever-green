name: evergreen
description: EverGreen - Enterprise Flutter Application
publish_to: 'none'
version: 2.0.0+30

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.1.0

  # Network
  dio: ^5.4.0
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.0

  # Functional Programming
  fpdart: ^1.1.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.2
  video_player: ^2.14.1
  fl_chart: ^1.3.0

  # PDF service-report generation + share/print
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  file_picker: ^11.0.3

dependency_overrides:
  # Override to avoid objective_c native build issues on Windows with spaces in path
  path_provider_foundation: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/landing/
    - assets/icons/
    - assets/videos/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
